name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  web:
    name: Build and deploy web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live_cv
    steps:
      - name: Checkout CV app
        uses: actions/checkout@v4
        with:
          path: live_cv

      - name: Checkout shared packages
        uses: actions/checkout@v4
        with:
          repository: Krispy145/packages
          path: packages

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write envied .env files
        run: |
          cp lib/environments/dev/.env.example lib/environments/dev/.env
          cp lib/environments/stage/.env.example lib/environments/stage/.env
          cp lib/environments/prod/.env.example lib/environments/prod/.env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate envied files
        run: dart run build_runner build

      - name: Build web
        env:
          GITHUB_USERNAME: Krispy145
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: make build-web ENV=dev

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: live_cv
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CV_PERSONAL_APP_DEV }}
          channelId: live
          projectId: cv-personal-app-dev
